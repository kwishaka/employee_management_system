# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Defaults to local H2 file database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin@123}

# JPA Configuration (Let Spring auto-detect the Dialect based on the active connection URL)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# H2 Console (Will only be active when using the H2 driver)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.ems.mis=DEBUG