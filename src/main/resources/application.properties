# ====== Server Configuration ======
# Dynamically uses Railway's assigned port, defaults to 8080 for local development
server.port=${PORT:8080}

# ====== Database Configuration (H2) ======
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=admin@123

# ====== JPA Configuration ======
# Removed explicit hibernate.dialect warning from your logs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ====== H2 Console ======
# Disabled for production to stop the Spring Security initialization crash
spring.h2.console.enabled=false

# ====== Logging ======
logging.level.org.springframework=INFO
logging.level.com.ems.mis=DEBUG

# ====== ACTUATOR (For Railway Health Checks) ======
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=*
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true